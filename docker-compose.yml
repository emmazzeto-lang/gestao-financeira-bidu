services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: gestao_financeira
    ports:
      - "5433:5432"
    # Volume com nome: os dados não se perdem quando o contêiner é recriado
    volumes:
      - banco_dev:/var/lib/postgresql/data

volumes:
  banco_dev:
