<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planos e metas - Fundação Amigos de João Bidu</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/tema.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body data-pagina="planos">
  <div class="app">
    <div class="conteudo">
      <main class="pagina">

        <div class="cabecalho-pagina">
          <div>
            <h1>Planos e metas</h1>
            <p>O plano distribui o valor aprovado em metas, e cada meta tem a sua fonte de recurso</p>
          </div>
          <div class="acoes" data-perfis="Administrador,Tesouraria">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#novoPlano">
              <i class="bi bi-plus-lg"></i> Novo plano
            </button>
          </div>
        </div>

        <div class="filtros">
          <select class="form-select" id="parceria" aria-label="Parceria"></select>
          <span class="resumo" id="resumo"></span>
        </div>

        <div class="d-flex gap-4 colunas align-items-start">
          <div class="flex-grow-1" style="min-width: 0">

            <section class="folha">
              <div class="folha-topo"><h2>Planos da parceria</h2></div>
              <div class="table-responsive">
                <table class="razao" style="min-width: 620px">
                  <thead>
                    <tr><th>Plano</th><th class="valor">Aprovado</th><th class="valor">Em metas</th><th style="width: 190px">Situação</th></tr>
                  </thead>
                  <tbody id="listaPlanos"></tbody>
                </table>
              </div>
            </section>

            <section class="folha">
              <div class="folha-topo flex-wrap">
                <div>
                  <h2 id="tituloMetas">Metas</h2>
                  <p class="texto-apoio" id="situacaoPlano"></p>
                </div>
                <button class="btn btn-primary btn-sm" type="button" id="validar" data-perfis="Administrador,Diretoria" hidden>
                  <i class="bi bi-patch-check"></i> Validar plano
                </button>
              </div>
              <div class="table-responsive">
                <table class="razao" style="min-width: 620px">
                  <thead>
                    <tr><th>Meta</th><th style="width: 200px">Fonte de recurso</th><th class="valor" style="width: 130px">Previsto</th><th style="width: 60px"></th></tr>
                  </thead>
                  <tbody id="listaMetas"></tbody>
                </table>
              </div>

              <form class="row g-2 px-3 pb-3 pt-2" id="formMeta" data-perfis="Administrador,Tesouraria" hidden novalidate>
                <div class="col-12 col-md-5">
                  <input class="form-control" id="descricaoMeta" maxlength="200" required placeholder="Ex.: Meta 1 - Alimentação" aria-label="Descrição da meta">
                </div>
                <div class="col-6 col-md-3">
                  <select class="form-select" id="fonteMeta" required aria-label="Fonte de recurso"></select>
                </div>
                <div class="col-6 col-md-2">
                  <input class="form-control campo-valor" id="valorMeta" inputmode="decimal" required placeholder="0,00" aria-label="Valor previsto">
                </div>
                <div class="col-12 col-md-2 d-grid">
                  <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-plus-lg"></i> Meta</button>
                </div>
              </form>
            </section>
          </div>

          <aside class="coluna-margem">
            <section class="folha">
              <div class="folha-topo"><h2>Fontes de recurso</h2></div>
              <ul class="list-unstyled px-3 small" id="listaFontes"></ul>
              <form class="px-3 pb-3" id="formFonte" data-perfis="Administrador,Tesouraria" novalidate>
                <div class="input-group">
                  <input class="form-control" id="nomeFonte" maxlength="150" required placeholder="Nova fonte" aria-label="Nome da fonte">
                  <button class="btn btn-outline-secondary" type="submit" aria-label="Adicionar fonte"><i class="bi bi-plus-lg"></i></button>
                </div>
              </form>
            </section>
          </aside>
        </div>

      </main>
    </div>
  </div>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="novoPlano" aria-labelledby="tituloNovoPlano" style="--bs-offcanvas-width: 420px">
    <div class="offcanvas-header border-bottom">
      <h2 class="offcanvas-title fs-5 fw-semibold" id="tituloNovoPlano">Novo plano de trabalho</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
    </div>
    <div class="offcanvas-body">
      <form id="formPlano" novalidate>
        <p class="texto-apoio" id="parceriaDoPlano"></p>
        <div class="mb-3">
          <label class="form-label" for="descricaoPlano">Descrição</label>
          <input class="form-control" id="descricaoPlano" maxlength="250" required placeholder="Ex.: Plano 2025/2027">
        </div>
        <div class="mb-4">
          <label class="form-label" for="valorPlano">Valor aprovado (R$)</label>
          <input class="form-control campo-valor" id="valorPlano" inputmode="decimal" required placeholder="0,00">
          <div class="form-text">Não pode passar o valor total da parceria.</div>
        </div>
        <div class="alert alert-danger d-none" id="erroPlano"></div>
        <div class="d-flex gap-2 justify-content-end">
          <button class="btn btn-link" type="button" data-bs-dismiss="offcanvas">Cancelar</button>
          <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Criar plano</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast" id="aviso" role="status">
      <div class="d-flex">
        <div class="toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/formato.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/planos.js"></script>
</body>
</html>
