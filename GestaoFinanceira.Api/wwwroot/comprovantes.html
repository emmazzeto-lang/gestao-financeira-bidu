<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notas e Comprovantes - Fundação Amigos de João Bidu</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/tema.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>

<body data-pagina="notas">
  <div class="app">
    <div class="conteudo">
      <main class="pagina">

        <div class="cabecalho-pagina">
          <div>
            <h1>Notas e comprovantes</h1>
            <p>Cada despesa com os documentos que a comprovam</p>
          </div>
        </div>

        <div class="filtros">
          <div class="input-group" style="max-width: 300px">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input class="form-control" id="busca" type="search" placeholder="Buscar despesa, fornecedor ou nº">
          </div>
        </div>

        <section class="folha">
          <div class="folha-topo flex-wrap">
            <h2>Despesas</h2>
            <div class="abas" id="abas">
              <button type="button" class="ativa" data-filtro="">Todas <b id="qtdTodas">0</b></button>
              <button type="button" data-filtro="com">Com comprovante <b id="qtdCom">0</b></button>
              <button type="button" data-filtro="sem">Sem comprovante <b id="qtdSem">0</b></button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="razao" style="min-width: 760px">
              <thead>
                <tr><th style="width: 60px">Nº</th><th style="width: 90px">Data</th><th>Despesa</th><th class="valor" style="width: 120px">Valor</th><th style="width: 260px">Comprovantes</th><th style="width: 100px"></th></tr>
              </thead>
              <tbody id="lista"></tbody>
            </table>
          </div>
        </section>

      </main>
    </div>
  </div>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="painelAnexo" aria-labelledby="tituloAnexo" style="--bs-offcanvas-width: 420px">
    <div class="offcanvas-header border-bottom">
      <h2 class="offcanvas-title fs-5 fw-semibold" id="tituloAnexo">Anexar comprovante</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
    </div>
    <div class="offcanvas-body">
      <form id="formAnexo" novalidate>
        <p class="texto-apoio" id="despesaDoAnexo"></p>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label" for="tipo">Tipo</label>
            <select class="form-select" id="tipo">
              <option value="NF-e">NF-e</option>
              <option value="NFS-e">NFS-e</option>
              <option value="Recibo">Recibo</option>
              <option value="Cupom fiscal">Cupom fiscal</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label" for="numero">Número</label>
            <input class="form-control" id="numero" maxlength="50" required>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="arquivo">Arquivo (PDF, JPG ou PNG, até 10 MB)</label>
          <input class="form-control" id="arquivo" type="file" accept=".pdf,.jpg,.jpeg,.png" required>
        </div>
        <div class="alert alert-danger d-none" id="erroAnexo"></div>
        <div class="d-flex gap-2 justify-content-end">
          <button class="btn btn-link" type="button" data-bs-dismiss="offcanvas">Cancelar</button>
          <button class="btn btn-primary" type="submit"><i class="bi bi-paperclip"></i> Anexar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast" id="aviso" role="status">
      <div class="d-flex">
        <div class="toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/formato.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/comprovantes.js"></script>
</body>
</html>
