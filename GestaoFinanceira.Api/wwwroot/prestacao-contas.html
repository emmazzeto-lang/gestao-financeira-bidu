<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prestação de contas - Fundação Amigos de João Bidu</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/tema.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body data-pagina="prestacao">
  <div class="app">
    <div class="conteudo">
      <main class="pagina">

        <div class="cabecalho-pagina">
          <div>
            <h1>Prestação de contas</h1>
            <p>Consolidado da execução com rastreabilidade de cada real</p>
          </div>
          <div class="acoes">
            <button class="btn btn-outline-secondary" type="button" id="baixarCsv"><i class="bi bi-file-earmark-spreadsheet"></i> Excel</button>
            <button class="btn btn-primary" type="button" id="imprimir"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
          </div>
        </div>

        <div class="filtros">
          <select class="form-select" id="parceria" aria-label="Parceria"></select>
          <select class="form-select" id="fonte" aria-label="Fonte de recurso"></select>
        </div>

        <div class="folha transporte">
          <span class="termo">Total previsto <span class="valor" id="totalPrevisto">-</span></span>
          <span class="termo saida">- Executado <span class="valor" id="totalExecutado">-</span></span>
          <span class="termo resultado">= Saldo a executar <span class="valor" id="totalSaldo">-</span></span>
        </div>
        <p class="nota-transporte" id="pendencias"></p>

        <div class="d-flex gap-4 colunas align-items-start">
          <div class="flex-grow-1" style="min-width: 0">

            <section class="folha">
              <div class="folha-topo">
                <div>
                  <h2>Execução por meta e fonte de recurso</h2>
                  <p class="texto-apoio" id="subtitulo"></p>
                </div>
                <span class="conferencia pendente" id="seloComprovantes"></span>
              </div>
              <div class="table-responsive">
                <table class="razao fixa" style="min-width: 760px">
                  <colgroup>
                    <col><col style="width: 160px"><col style="width: 116px"><col style="width: 116px">
                    <col style="width: 108px"><col style="width: 60px"><col style="width: 104px">
                  </colgroup>
                  <thead>
                    <tr>
                      <th>Meta</th><th>Fonte de recurso</th>
                      <th class="valor filete">Previsto</th><th class="valor">Executado</th><th class="valor">Saldo</th>
                      <th class="valor">%</th><th class="valor">Comprov.</th>
                    </tr>
                  </thead>
                  <tbody id="execucao"></tbody>
                </table>
              </div>
            </section>
          </div>

          <aside class="coluna-margem">
            <section class="folha">
              <div class="folha-topo">
                <div>
                  <h2>Rastreabilidade</h2>
                  <p class="texto-apoio" id="tituloTrilha">Do termo ao extrato</p>
                </div>
              </div>
              <ol class="trilha" id="trilha"></ol>
              <form class="px-3 pb-3 so-tela" id="formRastreio">
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                  <input class="form-control" id="numeroRastreio" placeholder="Nº da despesa" inputmode="numeric" aria-label="Número da despesa">
                </div>
              </form>
            </section>
          </aside>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/formato.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/prestacao-contas.js"></script>
  
</body>
</html>
