<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fornecedores - Fundação Amigos de João Bidu</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/tema.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body data-pagina="fornecedores">
  <div class="app">
    <div class="conteudo">
      <main class="pagina">

        <div class="cabecalho-pagina">
          <div>
            <h1>Fornecedores</h1>
            <p>Quem recebe os pagamentos da Fundação, com CPF ou CNPJ conferido</p>
          </div>
          <div class="acoes" data-perfis="Administrador,Tesouraria">
            <button class="btn btn-primary" type="button" id="novo"><i class="bi bi-plus-lg"></i> Novo fornecedor</button>
          </div>
        </div>

        <div class="filtros">
          <div class="input-group" style="max-width: 300px">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input class="form-control" id="busca" type="search" placeholder="Buscar nome ou documento">
          </div>
          <span class="resumo" id="resumo"></span>
        </div>

        <section class="folha">
          <div class="table-responsive">
            <table class="razao" style="min-width: 620px">
              <thead>
                <tr><th>Fornecedor</th><th style="width: 200px">CPF/CNPJ</th><th style="width: 120px">Situação</th><th style="width: 90px"></th></tr>
              </thead>
              <tbody id="lista"></tbody>
            </table>
          </div>
        </section>

      </main>
    </div>
  </div>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="painelForm" aria-labelledby="tituloForm" style="--bs-offcanvas-width: 420px">
    <div class="offcanvas-header border-bottom">
      <h2 class="offcanvas-title fs-5 fw-semibold" id="tituloForm">Novo fornecedor</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
    </div>
    <div class="offcanvas-body">
      <form id="form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="nome">Nome ou razão social</label>
          <input class="form-control" id="nome" maxlength="200" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="cpfCnpj">CPF ou CNPJ</label>
          <input class="form-control" id="cpfCnpj" maxlength="18" required placeholder="00.000.000/0000-00">
        </div>
        <div class="form-check form-switch mb-4" id="campoAtivo">
          <input class="form-check-input" type="checkbox" id="ativo">
          <label class="form-check-label" for="ativo">Ativo (aparece no lançamento de despesas)</label>
        </div>
        <div class="alert alert-danger d-none" id="erroSalvar"></div>
        <div class="d-flex gap-2 justify-content-end">
          <button class="btn btn-link" type="button" data-bs-dismiss="offcanvas">Cancelar</button>
          <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast" id="aviso" role="status">
      <div class="d-flex">
        <div class="toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/formato.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/fornecedores.js"></script>
</body>
</html>
